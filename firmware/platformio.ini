; STM32F411 "Blackpill" (WeAct) + MPU6050 -> roll/pitch/yaw over USB serial
;
; Two upload paths are provided:
;   [env:blackpill_f411ce]        USB DFU (hold BOOT0, tap RESET, release BOOT0)
;   [env:blackpill_f411ce_stlink] ST-Link/V2 SWD programmer
;
; USB CDC is enabled so the board shows up as a normal COM port over the
; same USB cable used to power it (Serial == that COM port).

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED

[env:blackpill_f411ce]
upload_protocol = dfu

[env:blackpill_f411ce_stlink]
upload_protocol = stlink
